name: Build Selene Private




on:
  workflow_dispatch:
  schedule:
    - cron: '0 19 * * *'




permissions:
  contents: write




jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: git clone --depth 1 https://github.com/MoonTechLab/Selene-Source.git selene
      - working-directory: selene
        run: |
          sed -i '' '/^  config:/,/^    enable-swift-package-manager: false/d' pubspec.yaml
      - id: upstream
        working-directory: selene
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - run: git -C selene apply ../selene-private.patch
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - working-directory: selene
        run: flutter pub get
      - working-directory: selene
        run: flutter build macos --release --dart-define=SELENE_PRIVATE_BUILD_ID=${{ steps.upstream.outputs.sha }}
      - working-directory: selene
        run: |
